<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link
	    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	    rel="stylesheet">
    <link
        href="/css/responsive.css"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>一般アカウント紹介</title>
</head>

<body>
<div class="container mt-5">

<h1 class="mb-4">一般アカウント紹介</h1>

<div th:if="${#lists.isEmpty(userList)}">
    <p>表示できる一般ユーザーはいません。</p>
</div>

<div class="table-scroll"
     th:if="${!#lists.isEmpty(userList)}">
<table class="table">

    <tr>
        <th>名前</th>
        <th>ふりがな</th>
        <th>年間いいね</th>
        <th>月間いいね</th>
        <th>詳細</th>
        <th>操作</th>
    </tr>

    <tr th:each="account : ${userList}">
        <td th:text="${account.name}"></td>
        <td th:text="${account.furigana}"></td>
        <td>
            <span th:id="'annual-likes-' + ${account.id}"
                  th:text="${account.annualLikes}">
            </span>
            件
        </td>
        <td>
            <span th:id="'monthly-likes-' + ${account.id}"
                  th:text="${account.monthlyLikes}">
            </span>
            件
        </td>
        <td>
            <a th:href="@{/introductions/{id}(id=${account.id})}"
               class="btn btn-secondary">
                詳細
            </a>
        </td>
        <td>
            <form th:action="@{/introductions/like-page/{id}(id=${account.id})}"
                  method="post">
                <input type="hidden" name="returnTo" value="introductions">
                <button type="submit" class="btn btn-primary">いいね</button>
            </form>
        </td>
    </tr>
</table>
</div>

<a th:href="${loggedInUser} ? @{/user} : @{/login}"
   class="btn btn-secondary">
    <span th:text="${loggedInUser} ? 'ダッシュボードへ戻る' : 'ログイン画面へ戻る'"></span>
</a>

</div>

</body>
</html>

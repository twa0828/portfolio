<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link
	    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	    rel="stylesheet">
    <link
        href="/css/responsive.css"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>プロフィール編集</title>
</head>

<body>
<div class="container mt-5">

<h1 class="mb-4">プロフィール編集</h1>

<p style="color:red;"
   th:text="${errorMessage}">
</p>

<p style="color:green;"
   th:text="${successMessage}">
</p>

<div th:if="${account.profileImage != null}"
     class="mb-3">

    <img src="/profile/image"
         alt="プロフィール画像"
         style="max-width: 160px; max-height: 160px;">
</div>

<form action="/profile/update"
      method="post"
      enctype="multipart/form-data">

    <div class="mb-3">
        <label class="form-label">
            プロフィール画像
        </label>

        <input type="file"
               name="profileImage"
               accept="image/*"
               class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">
            名前
        </label>

        <input type="text"
               name="name"
               th:value="${account.name}"
               class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">
            ふりがな
        </label>

        <input type="text"
               name="furigana"
               th:value="${account.furigana}"
               class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">
            性別
        </label>

        <select name="gender"
                class="form-control">

            <option value="男性"
                    th:selected="${account.gender == '男性'}">
                男性
            </option>

            <option value="女性"
                    th:selected="${account.gender == '女性'}">
                女性
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">
            年齢
        </label>

        <input type="text"
               name="age"
               th:value="${account.age}"
               class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">
            自己紹介
        </label>

        <textarea name="profile"
                  class="form-control"
                  rows="6"
                  th:text="${account.profile}"></textarea>
    </div>

    <button type="submit"
            class="btn btn-primary">
        更新
    </button>

    <a href="/user"
       class="btn btn-secondary">
        ダッシュボードへ戻る
    </a>
</form>

</div>
<script src="/js/profile-image-validation.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link
	    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	    rel="stylesheet">
<meta charset="UTF-8">
<title>アカウント追加</title>

<script>

function changeRole() {

    const role =
        document.querySelector(
            'input[name="role"]:checked'
        ).value;

    const userArea =
        document.getElementById(
            "user-area"
        );

    if (role === "USER") {

        userArea.style.display = "block";

    } else {

        userArea.style.display = "none";
    }
}

</script>

</head>

<body>
<div class="container mt-5">
<h1 class="mb-4">アカウント追加</h1>

<div th:if="${errorMessage}">

    <p style="color:red;"
       th:text="${errorMessage}">
    </p>

</div>

<form action="/accounts/create"
      method="post"
      enctype="multipart/form-data">

    <!-- 権限 -->
    <div>

        <input type="radio"
               name="role"
               value="ADMIN"
               checked
               onchange="changeRole()">

        管理者

        <input type="radio"
               name="role"
               value="USER"
               onchange="changeRole()">

        一般ユーザー

    </div>

    <br>

    <!-- 名前 -->
    <div>

        名前

        <br>

        <input type="text"
               name="name"
			   class="form-control">

    </div>

    <br>

    <!-- メアド -->
    <div>

        メールアドレス

        <br>

        <input type="text"
               name="email"
			   class="form-control">

    </div>

    <br>

    <!-- パスワード -->
    <div>

        パスワード

        <br>

        <input type="password"
               name="password"
			   class="form-control">

    </div>

    <br>

    <!-- ステータス -->
    <div>

        ステータス

        <br>

        <select name="status">

            <option value="アクセス許可">
                アクセス許可
            </option>

            <option value="アクセス禁止">
                アクセス禁止
            </option>

        </select>

    </div>

    <br>

    <!-- 一般ユーザー -->
    <div id="user-area"
         style="display:none;">

        <h3>一般ユーザー情報</h3>

        <!-- プロフィール画像 -->
        <div>

            プロフィール画像

            <br>

            <input type="file"
                   name="profileImage">

        </div>

        <br>

        <!-- ふりがな -->
        <div>

            ふりがな

            <br>

            <input type="text"
                   name="furigana">

        </div>

        <br>

        <!-- 性別 -->
        <div>

            性別

            <br>

            <select name="gender">

                <option value="男性">
                    男性
                </option>

                <option value="女性">
                    女性
                </option>

            </select>

        </div>

        <br>

        <!-- 年齢 -->
        <div>

            年齢

            <br>

            <input type="text"
                   name="age"
				   >

        </div>

        <br>

        <!-- 自己紹介 -->
        <div>

            自己紹介

            <br>

            <textarea name="profile">
            </textarea>

        </div>

    </div>

    <br>

	<button type="submit"
	        class="btn btn-primary">
        登録
    </button>

</form>

<br>

<a href="/accounts">
    一覧へ戻る
</a>
</div>
</body>
</html>

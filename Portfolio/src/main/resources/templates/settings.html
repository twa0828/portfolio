<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link
	    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	    rel="stylesheet">
    <link
        href="/css/responsive.css"
        rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>設定画面</title>

<style>

.error {
    color: red;
}

.success {
    color: green;
}

</style>

</head>

<body>
<div class="container mt-5">
<h1 class="mb-4">設定画面</h1>

<!-- エラー -->
<p class="error"
   th:text="${errorMessage}">
</p>

<!-- 成功 -->
<p class="success"
   th:text="${successMessage}">
</p>

<form action="/settings/update"
      method="post">

    <div>

        メールアドレス

        <br>

        <input type="text"
               name="email"
               th:value="${emailInput}"
			   class="form-control">

    </div>

    <br>

    <div>

        新しいパスワード（変更しない場合は空欄）

        <br>

        <input type="password"
               name="password"
			   th:value="${passwordInput}"
			   autocomplete="new-password"
			   class="form-control">

    </div>

    <button type="submit" class="btn btn-primary">
        更新
    </button>

</form>

<br>

<a href="/user">
    一般ユーザー画面へ戻る
</a>
</div>
</body>
</html>

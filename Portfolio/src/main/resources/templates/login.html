<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>

<body>

<h1>ログイン画面</h1>

<p th:text="${errorMessage}" 
		style="color:red;"></p>
		
<form action="/login" method="post">

    <div>
        ID:
        <input type="text" name="userId">
    </div>

    <br>

    <div>
        PASSWORD:
        <input type="password" name="password">
    </div>

    <br>

    <button type="submit">
        ログイン
    </button>
	
</form>

</body>
</html>

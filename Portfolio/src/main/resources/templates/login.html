<!DOCTYPE html>
<html>
<head>
	<link
	    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	    rel="stylesheet">
    <link
        href="/css/responsive.css"
        rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>ログイン</title>
</head>

<body>
<div class="container mt-5">
<h1 class="mb-4">ログイン画面</h1>

<p th:text="${errorMessage}" 
		style="color:red;"></p>
		
<form action="/login" method="post">

    <div>
        メールアドレス:
        <input type="text"
				name="userId"
				class="form-control">
    </div>

    <br>

    <div>
        PASSWORD:
        <input type="password"
				name="password"
				class="form-control">
    </div>

    <br>

    <button type="submit" class="btn btn-primary">
        ログイン
    </button>
	
</form>

<div class="page-actions mt-4">
    <a href="/introductions"
       class="btn btn-outline-primary">
        一般アカウント紹介
    </a>

    <a href="/like-ranking"
       class="btn btn-outline-primary">
        月のいいねランキング
    </a>
</div>
</div>
</body>
</html>

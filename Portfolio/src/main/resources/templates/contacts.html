<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>お問い合わせ一覧</title>

<style>

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
}

th {
    background-color: #eee;
}

</style>

</head>

<body>

<h1>お問い合わせ一覧</h1>

<table>

    <tr>
        <th>カテゴリー</th>
        <th>本文</th>
        <th>ステータス</th>
        <th>詳細</th>
    </tr>

    <tr th:each="contact : ${contactList}">

        <td th:text="${contact.category}">
        </td>

        <td th:text="${contact.content}">
        </td>

        <td th:text="${contact.status}">
        </td>

        <td>
            <button>
                詳細
            </button>
        </td>

    </tr>

</table>

<br>

<a href="/admin">
    管理者画面へ戻る
</a>

</body>
</html>

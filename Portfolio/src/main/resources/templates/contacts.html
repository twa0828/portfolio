<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link
	    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	    rel="stylesheet">
<meta charset="UTF-8">
<title>お問い合わせ一覧</title>

<style>

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
}

th {
    background-color: #eee;
}

</style>

</head>

<body>
<div class="container mt-5">
<h1 class="mb-4">お問い合わせ一覧</h1>

<form action="/contacts"
      method="get"
      class="mb-3">

    <label for="status">
        ステータス
    </label>

    <select id="status"
            name="status"
            class="form-select"
            style="width: 200px; display: inline-block;">

        <option value="all"
                th:selected="${selectedStatus == 'all'}">
            全て
        </option>

        <option value="未対応"
                th:selected="${selectedStatus == '未対応'}">
            未対応
        </option>

        <option value="対応中"
                th:selected="${selectedStatus == '対応中'}">
            対応中
        </option>

        <option value="対応済み"
                th:selected="${selectedStatus == '対応済み'}">
            対応済み
        </option>

    </select>

    <button type="submit"
            class="btn btn-primary">
        絞り込み
    </button>

</form>

<table>

    <tr>
        <th>カテゴリー</th>
        <th>本文</th>
        <th>ステータス</th>
        <th>詳細</th>
    </tr>

    <tr th:each="contact : ${contactList}">

        <td th:text="${contact.category}">
        </td>

        <td th:text="${contact.summary}">
        </td>

        <td th:text="${contact.status}">
        </td>

        <td>
			<a th:href="@{/contacts/{id}(id=${contact.id})}"
			   class="btn btn-primary">
                詳細
            </a>
        </td>

    </tr>

</table>

<br>

<a href="/admin">
    管理者画面へ戻る
</a>
</div>
</body>
</html>

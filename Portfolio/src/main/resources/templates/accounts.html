<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link
	    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	    rel="stylesheet">
<meta charset="UTF-8">
<title>アカウント一覧</title>

<style>

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    border: 1px solid #ccc;
    padding: 10px;
}

th {
    background-color: #eee;
}

button {
    margin-right: 5px;
}

</style>

</head>

<body>
<div class="container mt-5">
<h1 class="mb-4">アカウント一覧</h1>

<a href="/accounts/create">
    アカウント追加
</a>

<br><br>

<table>

    <tr>
        <th>名前</th>
        <th>メールアドレス</th>
        <th>ステータス</th>
        <th>操作</th>
    </tr>

    <tr th:each="account : ${accountList}">

        <td th:text="${account.name}">
        </td>

        <td th:text="${account.email}">
        </td>

        <td th:text="${account.status}">
        </td>

        <td>

			<a th:href="@{/accounts/edit/{id}(id=${account.id})}">
			    編集
			</a>
			<form th:action="@{/accounts/delete/{id}(id=${account.id})}"
			      method="post"
			      style="display:inline;">

			    <button type="submit"
						class="btn btn-primary">
			        削除
			    </button>

			</form>

			<form th:action="@{/accounts/status/{id}(id=${account.id})}"
			      method="post"
			      style="display:inline;">

				  <button type="submit"
				          class="btn btn-primary">

			        <span th:if="${account.status == 'アクセス許可'}">
			            アクセス禁止へ
			        </span>

			        <span th:if="${account.status == 'アクセス禁止'}">
			            アクセス許可へ
			        </span>

			    </button>

			</form>

        </td>

    </tr>

</table>
<br>

<div>

    <span th:each="i : ${#numbers.sequence(1, totalPages)}">

        <a th:href="@{/accounts(page=${i})}"
           th:text="${i}">
        </a>

        &nbsp;

    </span>

</div>

<br>

<a href="/admin">
    管理者画面へ戻る
</a>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
<meta charset="UTF-8">
<title>カテゴリー追加</title>
</head>

<body>
<div class="container mt-5">

<h1 class="mb-4">カテゴリー追加</h1>

<div th:if="${errorMessage}">

    <p style="color:red;"
       th:text="${errorMessage}">
    </p>

</div>

<form action="/categories/create"
      method="post">

    <div>
        名前
        <br>
        <input type="text"
               name="name"
               class="form-control">
    </div>

    <br>

    <button type="submit"
            class="btn btn-primary">
        登録
    </button>

</form>

<br>

<a href="/categories"
   class="btn btn-secondary">
    一覧へ戻る
</a>

</div>
</body>
</html>

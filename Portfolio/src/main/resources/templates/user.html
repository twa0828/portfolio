<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<link
	    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	    rel="stylesheet">
    <meta charset="UTF-8">
    <title>ダッシュボード</title>
</head>

<body>
<div class="container mt-5">

<h1 class="mb-4">ダッシュボード</h1>

<div class="row">

    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-body">
                <h2 class="h5 mb-3">自分の年間いいね</h2>

                <p class="display-6 mb-0">
                    <span th:text="${account.annualLikes}"></span>
                    <span>件</span>
                </p>
            </div>
        </div>
    </div>

    <div class="col-md-6 mb-4">
        <div class="card">
            <div class="card-body">
                <h2 class="h5 mb-3">自分の月間いいね</h2>

                <p class="display-6 mb-0">
                    <span th:text="${account.monthlyLikes}"></span>
                    <span>件</span>
                </p>
            </div>
        </div>
    </div>

</div>

<form action="/logout"
      method="post">

    <a href="/settings"
       class="btn btn-primary">
        設定
    </a>

    <a href="/profile"
       class="btn btn-primary">
        プロフィール編集
    </a>

    <a href="/introductions"
       class="btn btn-primary">
        一般アカウント紹介
    </a>

    <a href="/like-ranking"
       class="btn btn-primary">
        月のいいねランキング
    </a>

    <a href="/contact"
       class="btn btn-primary">
        お問い合わせ
    </a>

    <button type="submit"
            class="btn btn-secondary">
        ログアウト
    </button>
</form>

</div>
</body>
</html>

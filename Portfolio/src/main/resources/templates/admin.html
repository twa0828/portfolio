<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link
	    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	    rel="stylesheet">
    <link
        href="/css/responsive.css"
        rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>管理者ダッシュボード</title>

<style>

body {
    margin: 0;
    font-family: sans-serif;
}

/* ランキング */
.ranking-box {
    border: 1px solid #ccc;
    padding: 20px;
    margin-bottom: 30px;
}

</style>

</head>

<body>
<div class="admin-layout">

    <!-- サイドバー -->
    <div class="admin-sidebar">

        <h2>管理メニュー</h2>

        <a href="/admin">
            ダッシュボード
        </a>

        <a href="/accounts">
            アカウント一覧
        </a>
		<a href="/accounts/deleted">
		    アカウント削除一覧
		</a>

        <a href="/contacts">
            お問い合わせ一覧
        </a>

        <a href="/categories">
            カテゴリー一覧
        </a>

        <hr>

        <form action="/logout"
              method="post">

			  <button type="submit"
			          class="btn btn-primary">
                ログアウト
            </button>

        </form>

    </div>

    <!-- メイン -->
    <div class="admin-main">

        <h1 class="mb-4">管理者ダッシュボード</h1>

        <!-- 年間ランキング -->
        <div class="ranking-box">

            <h2>年間いいねランキング</h2>

            <p th:if="${#lists.isEmpty(yearRankingList)}">
                表示できるユーザーがいません。
            </p>

            <ul th:if="${!#lists.isEmpty(yearRankingList)}">
                <li th:each="account : ${yearRankingList}">
                    <span th:text="${account.name}"></span>
                    :
                    <span th:text="${account.annualLikes}"></span>
                    いいね
                </li>
            </ul>

        </div>

        <!-- 月間ランキング -->
        <div class="ranking-box">

            <h2>月間いいねランキング</h2>

            <p th:if="${#lists.isEmpty(monthRankingList)}">
                表示できるユーザーがいません。
            </p>

            <ul th:if="${!#lists.isEmpty(monthRankingList)}">
                <li th:each="account : ${monthRankingList}">
                    <span th:text="${account.name}"></span>
                    :
                    <span th:text="${account.monthlyLikes}"></span>
                    いいね
                </li>
            </ul>

        </div>

    </div>

</div>
</body>
</html>

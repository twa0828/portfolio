<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>アカウント削除一覧</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
<link
    href="/css/responsive.css"
    rel="stylesheet">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

</head>
<body>

<div class="container mt-5">

    <h1>アカウント削除一覧</h1>

    <div class="table-scroll">
    <table class="table table-bordered">

        <thead>
        <tr>
            <th>メールアドレス</th>
            <th>名前</th>
            <th>ステータス</th>
            <th>復元</th>
            <th>完全削除</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="account : ${deletedList}">

            <td th:text="${account.email}"></td>

            <td th:text="${account.name}"></td>

            <td th:text="${account.status}"></td>

            <td>

                <form
                    th:action="@{/accounts/restore/{id}(id=${account.id})}"
                    method="post">

                    <button
                        class="btn btn-success">
                        復元
                    </button>

                </form>

            </td>

            <td>

                <form
                    th:action="@{/accounts/permanent-delete/{id}(id=${account.id})}"
                    method="post">

                    <button
                        class="btn btn-danger">
                        完全削除
                    </button>

                </form>

            </td>

        </tr>

        </tbody>

    </table>
    </div>

    <div class="page-actions">
    <a
        href="/accounts"
        class="btn btn-secondary">

        アカウント一覧へ

    </a>

    <a
        href="/admin"
        class="btn btn-secondary">

        戻る

    </a>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link
	    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	    rel="stylesheet">
    <meta charset="UTF-8">
    <title>一般アカウント詳細</title>
</head>

<body>
<div class="container mt-5">

<h1 class="mb-4">一般アカウント詳細</h1>

<div th:if="${account.profileImage != null}"
     class="mb-3">

    <img th:src="@{/introductions/image/{id}(id=${account.id})}"
         alt="プロフィール画像"
         style="max-width: 180px; max-height: 180px;">
</div>

<table class="table">
    <tr>
        <th>名前</th>
        <td th:text="${account.name}"></td>
    </tr>

    <tr>
        <th>ふりがな</th>
        <td th:text="${account.furigana}"></td>
    </tr>

    <tr>
        <th>性別</th>
        <td th:text="${account.gender}"></td>
    </tr>

    <tr>
        <th>年齢</th>
        <td th:text="${account.age}"></td>
    </tr>

    <tr>
        <th>自己紹介</th>
        <td style="white-space: pre-wrap;"
            th:text="${account.profile}">
        </td>
    </tr>

    <tr>
        <th>年間いいね</th>
        <td>
            <span th:id="'annual-likes-' + ${account.id}"
                  th:text="${account.annualLikes}">
            </span>
            件
        </td>
    </tr>

    <tr>
        <th>月間いいね</th>
        <td>
            <span th:id="'monthly-likes-' + ${account.id}"
                  th:text="${account.monthlyLikes}">
            </span>
            件
        </td>
    </tr>
</table>

<button type="button"
        class="btn btn-primary"
        th:onclick="'likeAccount(' + ${account.id} + ')'">
    いいね
</button>

<a href="/introductions"
   class="btn btn-secondary">
    一覧へ戻る
</a>

</div>

<script>
function likeAccount(id) {

    fetch("/introductions/like/" + id, {
        method: "POST"
    })
    .then(response => {

        if (!response.ok) {

            throw new Error("like failed");
        }

        return response.json();
    })
    .then(data => {

        document.getElementById(
            "annual-likes-" + id
        ).textContent = data.annualLikes;

        document.getElementById(
            "monthly-likes-" + id
        ).textContent = data.monthlyLikes;
    })
    .catch(() => {

        alert("いいねに失敗しました");
    });
}
</script>
</body>
</html>

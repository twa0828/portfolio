<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link
	    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	    rel="stylesheet">
    <meta charset="UTF-8">
    <title>お問い合わせ</title>
</head>

<body>
<div class="container mt-5">

<h1 class="mb-4">お問い合わせ</h1>

<p style="color:red;"
   th:text="${errorMessage}">
</p>

<p style="color:green;"
   th:text="${successMessage}">
</p>

<form action="/contact/send"
      method="post"
      onsubmit="openMail()">

    <div class="mb-3">
        <label class="form-label">
            カテゴリー
        </label>

        <select id="category"
                name="category"
                class="form-control">

            <option value="">
                選択してください
            </option>

            <option th:each="category : ${categoryList}"
                    th:value="${category.name}"
                    th:text="${category.name}">
            </option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">
            お問い合わせ内容
        </label>

        <textarea id="content"
                  name="content"
                  rows="8"
                  class="form-control">
        </textarea>
    </div>

    <button type="submit"
            class="btn btn-primary">
        メール送信
    </button>

    <a href="/user"
       class="btn btn-secondary">
        ダッシュボードへ戻る
    </a>
</form>

</div>

<script>
function openMail() {

    const category =
        document.getElementById("category").value;

    const content =
        document.getElementById("content").value;

    const subject =
        encodeURIComponent("お問い合わせ: " + category);

    const body =
        encodeURIComponent(content);

    window.location.href =
        "mailto:?subject=" + subject + "&body=" + body;
}
</script>
</body>
</html>

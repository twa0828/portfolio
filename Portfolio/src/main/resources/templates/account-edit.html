<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<link
	    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	    rel="stylesheet">
    <link
        href="/css/responsive.css"
        rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>アカウント編集</title>

<script>

function changeRole() {

    const role =
        document.querySelector(
            'input[name="role"]:checked'
        ).value;

    const userArea =
        document.getElementById(
            "user-area"
        );

    if (role === "USER") {

        userArea.style.display = "block";

    } else {

        userArea.style.display = "none";
    }
}

window.addEventListener(
    "DOMContentLoaded",
    changeRole
);

</script>
</head>

<body>
<div class="container mt-5">
<h1 class="mb-4">アカウント編集</h1>

<div th:if="${errorMessage}">

    <p style="color:red;"
       th:text="${errorMessage}">
    </p>

</div>

<form th:action="@{/accounts/update/{id}(id=${account.id})}"
      method="post"
      enctype="multipart/form-data">

    <div>

        <input type="radio"
               name="role"
               value="ADMIN"
               th:checked="${account.role == 'ADMIN'}"
               onchange="changeRole()">

        管理者

        <input type="radio"
               name="role"
               value="USER"
               th:checked="${account.role == 'USER'}"
               onchange="changeRole()">

        一般ユーザー

    </div>

    <br>

    <div>

        名前

        <br>

        <input type="text"
               name="name"
			   class="form-control"
               th:value="${account.name}">

    </div>

    <br>

    <div>

        メールアドレス

        <br>

        <input type="text"
               name="email"
			   class="form-control"
               th:value="${account.email}">

    </div>

    <br>

    <div>

        ステータス

        <br>

        <select name="status"
                class="form-control">

            <option value="アクセス許可"
                th:selected="${account.status == 'アクセス許可'}">

                アクセス許可

            </option>

            <option value="アクセス禁止"
                th:selected="${account.status == 'アクセス禁止'}">

                アクセス禁止

            </option>

        </select>

    </div>

    <br>

    <div id="user-area">

        <h3>一般ユーザー情報</h3>

        <div>

            プロフィール画像

            <br>

            <input type="file"
                   name="profileImage"
                   accept="image/*"
                   class="form-control">

        </div>

        <br>

        <div>

            ふりがな

            <br>

            <input type="text"
                   name="furigana"
                   th:value="${account.furigana}"
                   class="form-control">

        </div>

        <br>

        <div>

            性別

            <br>

            <select name="gender"
                    class="form-control">

                <option value="男性"
                        th:selected="${account.gender == '男性'}">
                    男性
                </option>

                <option value="女性"
                        th:selected="${account.gender == '女性'}">
                    女性
                </option>

            </select>

        </div>

        <br>

        <div>

            年齢

            <br>

            <input type="text"
                   name="age"
                   th:value="${account.age}"
                   class="form-control">

        </div>

        <br>

        <div>

            自己紹介

            <br>

            <textarea name="profile"
                      class="form-control"
                      rows="6"
                      th:text="${account.profile}"></textarea>

        </div>

    </div>

    <br>

	<button type="submit"
	        class="btn btn-primary">
        更新
    </button>

</form>

<br>

<a href="/accounts">
    アカウント一覧へ戻る
</a>
</div>
<script src="/js/profile-image-validation.js"></script>
</body>
</html>
